<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slow Fixture Shop</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/blocking.js"></script>
  </head>
  <body>
    <header class="banner" id="banner">Fixture Shop</header>
    <main>
      <img
        id="hero"
        class="hero"
        src="/hero.svg"
        alt="Hero product"
        width="1200"
        height="800"
      />
      <h1 id="title">Welcome to the slow fixture</h1>
      <p id="intro">
        This page intentionally loads a late hero image, blocking script, and
        inserts a late banner that shifts layout.
      </p>
      <button id="buy" type="button">Buy now</button>
      <div id="catalog" class="catalog"></div>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
