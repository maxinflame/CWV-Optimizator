<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stable layout</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f7f3ea;
        color: #1b1b1b;
        font-family: Georgia, serif;
      }
      main {
        padding: 16px;
      }
      h1 {
        margin: 0;
        font-size: 32px;
        line-height: 40px;
        min-height: 40px;
      }
      p {
        margin: 12px 0 0;
        min-height: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="stable-title">Stable layout</h1>
      <p id="stable-copy">This page does not move after paint.</p>
    </main>
  </body>
</html>
